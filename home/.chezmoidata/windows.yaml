# this file holds the values the Windows scripts read as .windows.<key>
# edit a value here and run `chezmoi apply` to change the machine
windows:
  keyboard:
    speed: 31   # repeat rate from 0 (about 2/s) to 31 (about 30/s); macOS: KeyRepeat
    delay: 0    # delay before repeat from 0 (250 ms) to 3 (1 s); macOS: InitialKeyRepeat
  theme: dark   # dark or light
  sleep_after_minutes: 0    # idle time before the computer sleeps; 0 means never
  explorer:
    show_hidden: true       # show hidden files and folders
    show_extensions: true   # show filename extensions
  nas:
    host: unas              # hostname of the NAS (also NAS_HOST in setup.sh, which checks for its saved password)
    share: media            # the shared drive this PC may use; \\unas\media
    user: CX4200a           # the NAS account for this PC (it only has access to the media share)
    location: 'media on unas'   # name of the network location (the shortcut in Explorer)
    upload_dir: raw_videos  # folder in the share that move-videos.ps1 moves recordings into
  quick_access:             # pinned in this order (shell: names that Explorer understands)
    - 'shell:RecycleBinFolder'
    - 'shell:Desktop'
    - 'shell:Personal'      # Documents
    - 'shell:Downloads'
    - 'shell:My Video'      # Videos
  taskbar:                  # pinned after Start, in this order; id is a fixed Windows app, match is a wildcard on the Start menu name
                            # rebuild: true pins a fresh copy of the Start shortcut with no app ID, for apps whose windows carry none
                            # (otherwise Windows shows a second icon when the app runs); aumid adds the app ID the app's windows use,
                            # and target points the copy at another program (a wildcard path; the newest file wins)
                            # name and path pin a program that has no Start menu shortcut
    - {id: Microsoft.Windows.Explorer}
    - {id: MSEdge}
    - {match: 'AutoHotkey*'}
    - {name: 'Airfoil Satellite', path: 'C:\Program Files (x86)\AirfoilSatellite\AirfoilSatellite.exe'}
    - {match: 'Battle.net*', rebuild: true, target: 'C:\Program Files (x86)\Battle.net\Battle.net.exe'}
    - {match: 'CrystalDiskMark*'}
    - {match: 'FanControl*'}
    - {match: 'Minecraft Launcher*'}
    - {match: 'NVIDIA app*', rebuild: true}
    - {match: 'Samsung Magician*'}
    - {match: 'Steam*', rebuild: true, aumid: 'Valve.Steam.Client'}
    - {match: 'WinDirStat*'}
    - {match: 'Xbox*'}
  taskbar_options:
    combine: when_full      # "Combine taskbar buttons and hide labels": always, when_full, or never
    search: hidden          # the search box: hidden, icon, or box
    task_view: false        # show the Task View button (the multiple desktops icon)
    widgets: false          # show the Widgets button (weather and news)
  repos:                    # public repos cloned to ~\repos\<name> (anonymous https, so no YubiKey)
    - name: games
      url: https://github.com/sheatsley/games.git
  apps:                     # installed with winget when missing; source is winget or msstore; location (optional) is passed as --location
    - {name: AutoHotkey,          id: AutoHotkey.AutoHotkey,            source: winget}
    - {name: Battle.net,          id: Blizzard.BattleNet,               source: winget, location: 'C:\Program Files (x86)\Battle.net'}
    - {name: CrystalDiskMark,     id: CrystalDewWorld.CrystalDiskMark,  source: winget}
    - {name: FanControl,          id: Rem0o.FanControl,                 source: winget}
    - {name: Minecraft Launcher,  id: Mojang.MinecraftLauncher,         source: winget}
    - {name: NVIDIA App,          id: XP8CLZL93F5Z4P,                   source: msstore}
    - {name: PawnIO,              id: namazso.PawnIO,                   source: winget}
    - {name: Samsung Magician,    id: XPDDT99J9GKB5C,                   source: msstore}
    - {name: Steam,               id: Valve.Steam,                      source: winget}
    - {name: Sunshine,            id: LizardByte.Sunshine,              source: winget}
    - {name: step,                id: Smallstep.step,                   source: winget}
    - {name: WinDirStat,          id: WinDirStat.WinDirStat,            source: winget}
    - {name: Xbox,                id: 9MV0B5HZVK9Z,                     source: msstore}
  manual_apps:              # not available through winget; the URL is printed until detect matches an installed program
    - name: Airfoil Satellite
      url: https://rogueamoeba.com/airfoil/satellite/windows/
      detect: 'Airfoil*'
      path: 'C:\Program Files (x86)\AirfoilSatellite\AirfoilSatellite.exe'   # also counts as installed when this file exists
    - name: VB-Audio Virtual Cable
      url: https://vb-audio.com/Cable/
      detect: 'VBCABLE*'
  sunshine_options:         # lines set in Sunshine's config (sunshine.conf); Sunshine restarts when one changes
    csrf_allowed_origins: https://cx4200a.lan   # lets the web UI accept changes when opened by name from another computer (comma-separated https:// origins)
  sunshine_cert:            # Sunshine's certificate from the homelab CA (see "Sunshine's certificate" in MAINTENANCE.md)
    enabled: true           # false leaves Sunshine's certificate alone (see MAINTENANCE.md to go back to its own)
    name: cx4200a.lan       # the name it is for: this PC on the LAN
    ca_url: https://step-ca.lan:9000
    provisioner: sunshine   # the step-ca ACME provisioner that allows long-lived certificates for this name only
    lifetime: 19680h        # 820 days; Apple refuses server certificates valid for more than 825
    warn_days: 60           # each apply warns once fewer days than this remain
  ssh_server:               # OpenSSH server, so VS Code (Remote - SSH) and ssh can reach this PC from the LAN
    authorized_keys:        # public keys allowed to sign in (one per entry, from `ssh-add -L`); an empty list means nobody can
      - 'ssh-rsa  yubikey-rsa'
      - 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBJapCIOO+1t2wAHhMU2GZs42WYJFEKvFZT8oxvNzWls8xsj8Wbw/7gJ6dVVe/C00FOazMKyeOvrddWlRID+G0So= yubikey-ecdsa'
    password_login: false   # allow passwords as well; false means keys only
    shell: powershell       # what a session starts: powershell or cmd
  system_restore:           # restore points, so a bad driver or Windows update can be undone
    drive: 'C:\'
    max_size: 5%            # space the restore points may use, as a percent of the drive (or a size such as 100GB)
    daily_at: '03:00'       # a restore point is created every day at this time (or at the next start if the PC was off)
  ohmgraphite:
    dir: 'C:\Apps\OhmGraphite'
    token_var: OHMGRAPHITE_INFLUX_TOKEN   # machine-wide variable holding the token (also OHM_TOKEN_VAR in setup.sh)
    type: influx2
    interval: 5             # seconds between readings
    influx2:
      address: https://influxdb.lan:8086
      org: sheatsley-systems
      bucket: windows
